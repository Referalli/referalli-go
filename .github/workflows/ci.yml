# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Lint (gofmt and vet)
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Test
        run: go test -race ./...
        env:
          REFERALLI_WEBHOOK_VECTORS: ${{ github.workspace }}/testdata/webhook-vectors.json
      - name: Build
        run: go build ./...
