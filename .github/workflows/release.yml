# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# The Go module proxy serves github.com/referalli/referalli-go straight from vX.Y.Z tags at this
# repo's root, so releasing is the tag itself (pushed by the monorepo's sync-mirrors.ts --tag).
# This checks the version, asks the proxy to fetch the tag, and drafts the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Version matches the tag
        run: grep -Eq "Version += +\"${GITHUB_REF_NAME#v}\"" *.go
      - run: go test ./...
        env:
          REFERALLI_WEBHOOK_VECTORS: ${{ github.workspace }}/testdata/webhook-vectors.json
      - name: Warm the Go module proxy
        run: curl -sSf "https://proxy.golang.org/github.com/referalli/referalli-go/@v/${GITHUB_REF_NAME}.info"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
